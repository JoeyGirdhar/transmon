[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transmon"
version = "0.1.0"
description = "Transmon qubit simulator: spectrum, charge dispersion, anharmonicity and driven dynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["transmon"]
